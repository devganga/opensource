services:
  opencart:
    image: alto9/opencart:0.0.3
    container_name: opencart_app
    ports:
      - "8080:8080"
      - "8443:8443"
    environment:
      - OPENCART_DATABASE_HOST=mysql
      - OPENCART_DATABASE_PORT_NUMBER=3306
      - OPENCART_DATABASE_USER=opencart
      - OPENCART_DATABASE_PASSWORD=opencart123
      - OPENCART_DATABASE_NAME=opencart
      - ALLOW_EMPTY_PASSWORD=no
    depends_on:
      - mysql
    volumes:
      - opencart_data:/opencart/opencart
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    container_name: opencart_db
    environment:
      - MYSQL_ROOT_PASSWORD=root123
      - MYSQL_DATABASE=opencart
      - MYSQL_USER=opencart
      - MYSQL_PASSWORD=opencart123
    volumes:
      - mysql_data:/var/lib/mysql
    restart: unless-stopped

volumes:
  opencart_data:
  mysql_data: