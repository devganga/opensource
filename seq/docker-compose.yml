services:
  seq:
    image: datalust/seq:latest
    container_name: seq
    restart: unless-stopped
    ports:
      - "5341:80"
      #- "5341:5341/udp" # Optional: for GELF ingestion
    #volumes:
    #  - seq-data:/data
    environment:
      ACCEPT_EULA: 'Y'
      # Set a password for the initial admin user on first run (optional but recommended)
      SEQ_FIRSTRUN_ADMINPASSWORD: 'MyStrongPassword'
#volumes:
#  seq-data:
    networks:
      - api-network
networks:
  api-network:
    external: true